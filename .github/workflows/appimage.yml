name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/work/target
          key: target-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-

      - name: Build
        run: ./build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: build/*.AppImage

      - name: Update the "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/*.AppImage --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. For stable versions see the other releases."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.AppImage --title "Aloft ${GITHUB_REF_NAME#v}" --generate-notes
